<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyLoop 面板</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0d141b; --card:#141f29; --card2:#1b2934; --card3:#22323f;
  --ink:#e3ebf2; --ink2:#9fb2c0; --ink3:#6b8095;
  --line:#233343; --blue:#5aa3d8; --ok:#4fb98a; --warn:#d9a05b; --bad:#d4705f; --purple:#9b8ad4;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}

/* ---------- 顶栏 ---------- */
.top{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);
  background:var(--card);flex-shrink:0}
.top h1{font-size:16px;margin:0;white-space:nowrap}
.top h1 span{color:var(--blue)}
.idea{color:var(--ink2);font-size:13px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--card2);
  color:var(--ink2);white-space:nowrap;border:1px solid var(--line)}
.pill.hot{background:#3a2320;color:var(--warn);border-color:#5c3a2a}
.pill.run{background:#12293a;color:var(--blue);border-color:#2a5170}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);
  margin-right:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}

/* ---------- 主体 ---------- */
.main{flex:1;display:flex;min-height:0}
.side{width:222px;flex-shrink:0;border-right:1px solid var(--line);overflow-y:auto;
  padding:12px 10px;background:#101922}
.sec{font-size:11px;color:var(--ink3);letter-spacing:.08em;margin:14px 6px 7px}
.sec:first-child{margin-top:0}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink2);
  padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;font-family:inherit;
  display:flex;align-items:center;gap:8px}
.nav:hover{background:var(--card2);color:var(--ink)}
.nav.on{background:var(--card3);color:var(--ink);font-weight:600}
.nav i{font-style:normal;font-size:11px;width:17px;height:17px;line-height:17px;text-align:center;
  border-radius:50%;background:var(--line);color:var(--ink3);flex-shrink:0}
.nav.done i{background:#1e4736;color:var(--ok)} .nav.done{color:var(--ink2)}
.nav.now i{background:var(--blue);color:#08121a} .nav.now{color:var(--ink);font-weight:600}
.nav .gate{margin-left:auto;font-size:10px;color:var(--warn)}
.nav .badge2{margin-left:auto;font-size:10px;background:var(--line);color:var(--ink3);
  padding:0 6px;border-radius:9px}

.body{flex:1;overflow-y:auto;padding:20px 24px}
.body.wide{max-width:none}
h2.vh{font-size:19px;margin:0 0 3px}
p.vs{color:var(--ink3);font-size:13px;margin:0 0 18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:14px}
.card h3{font-size:13px;margin:0 0 12px;color:var(--ink3);letter-spacing:.05em;font-weight:600}
.card.hi{border-color:#2a5170;background:#101f2c}
.card.gate{border-color:#5c3a2a;background:#1d1712}

/* ---------- 按钮 ---------- */
.btn{background:var(--card3);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 15px;font-size:14px;cursor:pointer;font-family:inherit;line-height:1.3}
.btn:hover:not(:disabled){background:#2c3f4f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--blue);color:#08121a;border-color:var(--blue);font-weight:600}
.btn.pri:hover:not(:disabled){background:#6fb3e4}
.btn.warn{background:var(--warn);color:#1d1207;border-color:var(--warn);font-weight:600}
.btn.warn:hover:not(:disabled){background:#e5b374}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:#4a2a26}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.bwrap{display:inline-flex;flex-direction:column;gap:3px}
.bwrap small{color:var(--ink3);font-size:11.5px;padding-left:2px}

input,textarea,select{background:var(--card2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:9px 12px;font:14px/1.5 inherit;font-family:inherit;width:100%}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--blue)}
textarea{resize:vertical;min-height:74px}
label{display:block;font-size:12.5px;color:var(--ink3);margin:0 0 5px}
.fld{margin-bottom:12px}

/* ---------- 人 ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:10px}
.p{background:var(--card2);border-radius:9px;padding:11px 13px;border-left:2px solid var(--line)}
.p.adv{border-left-color:var(--blue)} .p.exe{border-left-color:var(--warn)}
.p.dis{border-left-color:var(--purple)} .p.arc{opacity:.5}
.ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.ph b{font-size:14px}
.po{font-size:11.5px;color:var(--ink3);line-height:1.45;margin-bottom:8px}
.tag{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--line);color:var(--ink3)}
.tag.pv{background:#173a2c;color:var(--ok);font-weight:600}
.tag.mdl{background:#2a2340;color:var(--purple)}
.tag.n{margin-left:auto;background:var(--line);color:var(--ink3)}

/* ---------- 表 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:600;padding:0 7px 7px;
  border-bottom:1px solid var(--line)}
td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;color:var(--ink3);white-space:nowrap}
.dim{color:var(--ink3)}
.badge{font-size:11px;padding:1px 7px;border-radius:3px;white-space:nowrap}
.bok{background:#16362a;color:var(--ok)} .bno{background:#3a2320;color:var(--bad)}
.brun{background:#1d3547;color:var(--blue)}
.bar{width:78px} .bar i{display:block;height:6px;background:var(--blue);border-radius:3px}

/* ---------- 群聊 ---------- */
.msg{border-bottom:1px solid var(--line);padding:12px 0}
.msg:last-child{border:0}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.mh b{font-size:13px;color:var(--blue)} .mh time{font-size:11px;color:var(--ink3)}
.msg.me .mh b{color:var(--ok)} .msg.ceo .mh b{color:var(--warn)} .msg.sys .mh b{color:var(--ink3)}
.mb{font-size:13.5px;color:var(--ink2);white-space:pre-wrap;word-break:break-word;
  max-height:270px;overflow:auto}

/* ---------- 文档 ---------- */
.doc{font-size:14px;line-height:1.8;color:var(--ink2)}
.doc h1{font-size:19px;color:var(--ink);margin:20px 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.doc h2{font-size:16.5px;color:var(--ink);margin:20px 0 8px}
.doc h3{font-size:14.5px;color:var(--ink);margin:16px 0 6px;letter-spacing:0}
.doc p{margin:9px 0} .doc ul,.doc ol{margin:9px 0;padding-left:22px} .doc li{margin:4px 0}
.doc strong{color:var(--ink)}
.doc code{background:var(--card2);padding:1px 6px;border-radius:4px;font-size:12.5px;color:var(--warn)}
.doc pre{background:var(--card2);padding:12px;border-radius:8px;overflow:auto;font-size:12.5px}
.doc pre code{background:none;padding:0;color:var(--ink2)}
.doc blockquote{border-left:3px solid var(--line);margin:10px 0;padding:2px 0 2px 14px;color:var(--ink3)}
.doc table{margin:12px 0} .doc td,.doc th{font-size:13px}
.doc hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.doc a{color:var(--blue)}
.docwrap{max-height:64vh;overflow-y:auto}

/* ---------- 输出栏 ---------- */
.out{flex-shrink:0;border-top:1px solid var(--line);background:#0a1016;
  display:flex;flex-direction:column;max-height:46vh}
.outh{display:flex;align-items:center;gap:10px;padding:7px 16px;font-size:12.5px;
  color:var(--ink3);cursor:pointer;user-select:none;flex-shrink:0}
.outh b{color:var(--ink2);font-weight:600}
.outb{overflow-y:auto;padding:0 16px 14px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.out.min .outb{display:none}
.empty{color:var(--ink3);font-size:13px;text-align:center;padding:22px 0}
.note{font-size:12.5px;color:var(--warn);background:#1d1712;border:1px solid #4a3524;
  border-radius:8px;padding:10px 13px;margin:12px 0;line-height:1.65}
.note.info{color:var(--ink2);background:var(--card2);border-color:var(--line)}
.note b{color:var(--warn)}
.note.info b{color:var(--ink)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.k b{display:block;font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums}
.k span{font-size:12px;color:var(--ink3)}
.k.ok b{color:var(--ok)} .k.warn b{color:var(--warn)} .k.blue b{color:var(--blue)}
.prog{height:5px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.prog.hot i{background:var(--bad)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card3);
  border:1px solid var(--line);border-radius:9px;padding:11px 18px;font-size:13.5px;z-index:99;
  box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:80vw}
.toast.bad{border-color:#5c332c;color:var(--bad)}
</style></head>
<body>

<div class="top">
  <h1>Money<span>Loop</span></h1>
  <div class="idea" id="idea">读取中…</div>
  <div class="pill" id="pBud">—</div>
  <div class="pill" id="pJob" style="display:none"></div>
  <button class="btn sm ghost" id="btnStop" style="display:none">停下</button>
</div>

<div class="main">
  <div class="side" id="side"></div>
  <div class="body" id="view"><p class="empty">读取中…</p></div>
</div>

<div class="out min" id="out">
  <div class="outh" id="outh">
    <b>运行输出</b><span id="outMeta">还没跑过</span>
    <span style="margin-left:auto" id="outTog">展开 ▲</span>
  </div>
  <div class="outb" id="outb"></div>
</div>

<script>
const TOKEN = "__TOKEN__";
let S = null;          // 最新状态
let VIEW = "flow";     // 当前在看哪一页
let POLL = null;       // 输出轮询
let OUTLEN = 0;

const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg, bad){
  const d = document.createElement("div");
  d.className = "toast" + (bad ? " bad" : "");
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), bad ? 6500 : 3200);
}

async function api(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({"X-Token":TOKEN,"Content-Type":"application/json"}, opt.headers||{});
  const r = await fetch(path, opt);
  const j = await r.json().catch(()=>({error:"服务器没回话"}));
  if(!r.ok) throw new Error(j.error || ("出错了 "+r.status));
  return j;
}

// ---------- 跑一条命令 ----------
async function run(cmd, args, quiet){
  try{
    await api("/api/run", {method:"POST", body:JSON.stringify({cmd:cmd, args:args||[]})});
    OUTLEN = 0;
    $("#outb").textContent = "";
    $("#out").classList.remove("min");
    $("#outTog").textContent = "收起 ▼";
    startPoll();
    if(!quiet) toast("开跑：" + cmd);
  }catch(e){ toast(e.message, true); }
}

function startPoll(){
  if(POLL) clearInterval(POLL);
  POLL = setInterval(pollJob, 700);
  pollJob();
}

async function pollJob(){
  let j;
  try{ j = await api("/api/job?from=" + OUTLEN); }catch(e){ return; }
  if(j.text){
    OUTLEN = j.total;
    const b = $("#outb");
    const stuck = b.scrollTop + b.clientHeight >= b.scrollHeight - 40;
    b.textContent += j.text;
    if(stuck) b.scrollTop = b.scrollHeight;
  }
  $("#outMeta").textContent = j.cmd
    ? (j.running ? "正在跑 " + j.cmd + "（" + j.secs + " 秒）" : j.cmd + " · 用了 " + j.secs + " 秒")
    : "还没跑过";
  const pj = $("#pJob"), bs = $("#btnStop");
  if(j.running){
    pj.style.display=""; pj.className="pill run";
    pj.innerHTML = '<span class="dot"></span>' + esc(j.cmd);
    bs.style.display="";
  }else{
    pj.style.display="none"; bs.style.display="none";
    if(POLL){ clearInterval(POLL); POLL=null; }
    refresh();
    if(j.rc !== null && j.rc !== 0 && j.rc !== undefined){
      // 退出码 2 是"该你了"，不是坏了——这是这套东西特意区分开的
      if(j.rc === 2) toast("停下来了，轮到你做点什么。看下面的输出。");
      else toast("这条没跑成（退出码 " + j.rc + "），看下面的输出。", true);
    }
  }
}

$("#btnStop").onclick = async e => {
  e.stopPropagation();
  await api("/api/stop", {method:"POST", body:"{}"});
  toast("已叫停。");
};
$("#outh").onclick = () => {
  const o = $("#out"); o.classList.toggle("min");
  $("#outTog").textContent = o.classList.contains("min") ? "展开 ▲" : "收起 ▼";
};

// ---------- 极简 markdown ----------
function md(t){
  if(!t) return '<p class="empty">这份还没有内容。</p>';
  const lines = t.split("\n");
  let h="", inCode=false, list=null, tbl=null;
  const close = () => { if(list){h+="</"+list+">";list=null;}
                        if(tbl){h+="</tbody></table>";tbl=null;} };
  const inl = s => esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(let raw of lines){
    if(/^```/.test(raw)){
      if(inCode){h+="</code></pre>";inCode=false;} else {close();h+="<pre><code>";inCode=true;}
      continue;
    }
    if(inCode){ h += esc(raw)+"\n"; continue; }
    const l = raw.trimEnd();
    if(!l.trim()){ close(); continue; }
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ close(); const n=Math.min(m[1].length,3);
      h+="<h"+n+">"+inl(m[2])+"</h"+n+">"; continue; }
    if(/^([-*_])\1{2,}$/.test(l.trim())){ close(); h+="<hr>"; continue; }
    if(/^\|/.test(l)){
      const cells = l.split("|").slice(1,-1).map(c=>c.trim());
      if(/^\|[\s:|-]+\|$/.test(l)) continue;           // 分隔行
      if(!tbl){ close(); tbl=1;
        h+="<table><thead><tr>"+cells.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead><tbody>";
        continue; }
      h+="<tr>"+cells.map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>"; continue;
    }
    if(tbl){ h+="</tbody></table>"; tbl=null; }
    if((m=l.match(/^\s*[-*]\s+(.*)$/))){
      if(list!=="ul"){ close(); h+="<ul>"; list="ul"; }
      h+="<li>"+inl(m[1])+"</li>"; continue; }
    if((m=l.match(/^\s*\d+\.\s+(.*)$/))){
      if(list!=="ol"){ close(); h+="<ol>"; list="ol"; }
      h+="<li>"+inl(m[1])+"</li>"; continue; }
    if((m=l.match(/^>\s?(.*)$/))){ close(); h+="<blockquote>"+inl(m[1])+"</blockquote>"; continue; }
    close(); h+="<p>"+inl(l)+"</p>";
  }
  close(); if(inCode) h+="</code></pre>";
  return h;
}

// ---------- 侧边栏 ----------
function drawSide(){
  const s = S; let h = '<div class="sec">九步流程</div>';
  s.steps.forEach(st => {
    if(st.key === "done") return;
    h += '<button class="nav '+st.state+'" data-v="step:'+st.key+'">'
       + '<i>'+st.n+'</i>'+esc(st.label)
       + (st.signoff ? '<span class="gate">你拍板</span>' : '')
       + '</button>';
  });
  const cnt = (n)=> n ? '<span class="badge2">'+n+'</span>' : '';
  h += '<div class="sec">组织和干活</div>'
    +  '<button class="nav" data-v="flow">🧭 现在该干什么</button>'
    +  '<button class="nav" data-v="team">👥 组织'+cnt(s.roles.length)+'</button>'
    +  '<button class="nav" data-v="chat">💬 群聊'+cnt(s.chat.length)+'</button>'
    +  '<button class="nav" data-v="work">📋 派活'+cnt(s.tasks.filter(t=>t.state!=="验收过了").length)+'</button>'
    +  '<button class="nav" data-v="expert">🎓 外部专家</button>'
    +  '<div class="sec">控制</div>'
    +  '<button class="nav" data-v="api">🔌 接口（谁用谁家的 AI）</button>'
    +  '<button class="nav" data-v="money">💰 钱</button>'
    +  '<button class="nav" data-v="think">🤔 帮我判断 / 纠错</button>';
  const el = $("#side"); el.innerHTML = h;
  el.querySelectorAll(".nav").forEach(b => {
    if(b.dataset.v === VIEW) b.classList.add("on");
    b.onclick = () => { VIEW = b.dataset.v; draw(); };
  });
}

// ---------- 各个页面 ----------
function busy(){ return S.job && S.job.running; }
function bdis(){ return busy() ? "disabled" : ""; }

function vFlow(){
  const s = S, st = s.steps[s.stage_index];
  if(!s.started || !s.idea){
    return '<h2 class="vh">先说一句你想做什么</h2>'
      + '<p class="vs">一句话就行，不用想得多完整。它会带着你把这句话撑开。</p>'
      + '<div class="card hi"><div class="fld"><label>你的想法</label>'
      + '<textarea id="fIdea" placeholder="比如：我想做个帮我记客户跟进的小工具"></textarea></div>'
      + '<div class="row"><button class="btn pri" id="bStart" '+bdis()+'>开始</button>'
      + '<span class="dim" style="font-size:12.5px">第一步它会问你：给谁用、谁掏钱、要赚多少、倒推算账</span></div></div>'
      + '<div class="note info"><b>建议先设个花钱上限。</b>这套东西每跑一步都要调用 AI，是花钱的。'
      + '去左边「💰 钱」里设一个数，到顶会自动停。</div>';
  }

  let h = '<h2 class="vh">现在该干什么</h2><p class="vs">'
        + '一直点「继续」就行，到该你拍板的地方它会停下来。</p>';

  h += '<div class="kpi">'
    + kpi("blue", s.todo_done+"/"+(s.todo_done+s.todo_open), "项目任务做完",
          pctv(s.todo_done, s.todo_done+s.todo_open))
    + kpi(s.todo_gate?"warn":"", s.todo_gate, "只有你能干的")
    + kpi("", s.roles.length, "在岗 · 封存 "+s.archived.length)
    + kpi(budHot()?"warn":"ok", "$"+moneyText(), "花了 / 上限", budBar())
    + kpi(s.revisions?"ok":"warn", s.revisions, "标准改过几次")
    + '</div>';

  if(s.closed){
    h += '<div class="note"><b>这个项目已经结项了。</b>复盘在 docs/99-结项.md。</div>';
  }

  const gateNow = st.signoff && st.ran && !st.signed;
  h += '<div class="card '+(gateNow?"gate":"hi")+'">'
     + '<h3>第 '+st.n+' 步 · '+esc(st.label)+(st.signoff?'　←　这一步只有你能定':'')+'</h3>';

  if(gateNow){
    h += '<p style="margin:0 0 6px">它已经把这一步做完了，'
       + '<b>东西在下面，你看完再决定。</b></p>'
       + '<p class="dim" style="font-size:13px;margin:0 0 14px">'
       + '这是生意问题不是技术问题——凭什么是我们、什么算好、砍哪个功能、花多少钱。'
       + '这些替你定只能靠编。</p>'
       + '<div class="row">'
       + '<div class="bwrap"><button class="btn warn" data-run="go" '+bdis()+'>看过了，确认，往下走</button>'
       + '<small>确认之后进入第 '+(st.n+1)+' 步</small></div>'
       + '<div class="bwrap"><button class="btn danger" data-run="back" '+bdis()+'>这一步方向就不对，退回重做</button>'
       + '<small>旧文档还在，它会在原基础上重做</small></div></div>';

function vStep(key){
  const st = S.steps.find(x => x.key === key);
  if(!st) return '<p class="empty">没有这一步</p>';
  let h = '<h2 class="vh">第 '+st.n+' 步 · '+esc(st.label)+'</h2>'
        + '<p class="vs">'
        + (st.signoff ? "这一步是生意问题，只有你能拍板。" : "这一步它自己能定，不用烦你。")
        + '　状态：' + (st.state==="done"?"做完了":st.state==="now"?"正在这一步":"还没到")
        + '</p>';
  if(st.state === "now"){
    h += '<div class="row" style="margin-bottom:14px">'
       + '<button class="btn pri" data-run="go" '+bdis()+'>'
       + (st.signoff && st.ran && !st.signed ? "确认，往下走" : "跑这一步") + '</button>'
       + '<button class="btn danger" data-run="back" '+bdis()+'>退回上一步重做</button></div>';
  }
  if(st.has_doc){
    h += '<div class="card"><h3>'+esc(st.doc)+'</h3>'
       + '<div class="doc" id="docBox"><p class="empty">读取中…</p></div></div>';

    h += '<div class="note info">这一步还没产出 <b>'+esc(st.doc)+'</b>。跑到这一步就有了。</div>';

  return h;
}

async function loadDoc(name){
  try{
    const j = await api("/api/doc?name=" + encodeURIComponent(name));
    const b = $("#docBox"); if(b) b.innerHTML = md(j.text);
  }catch(e){ const b=$("#docBox"); if(b) b.innerHTML='<p class="empty">读不出来</p>'; }
}

    + '<div class="card"><h3>感觉哪儿不对</h3>'
    + '<p style="margin:0 0 12px">先查错在哪一层，再决定怎么改。'
    + '<b>改错层，越改越糟。</b></p>'
    + '<button class="btn pri" data-run="correct" '+bdis()+'>帮我纠错</button></div>'
    + '<div class="card"><h3>别的</h3><div class="row">'
    + '<div class="bwrap"><button class="btn" data-run="status" '+bdis()+'>看一眼进度</button><small>打在下面</small></div>'
    + '<div class="bwrap"><button class="btn" data-run="看板" '+bdis()+'>生成静态看板</button>'
    + '<small>存成 看板.html，可以放网盘用手机看</small></div>'
    + '<div class="bwrap"><button class="btn danger" id="bClose" '+bdis()+'>结项</button>'
    + '<small>封存 ＋ 写一份诚实的复盘，教训存进判断档案</small></div>'
    + '</div></div>'
    + '<div class="note info"><b>为什么面板上没有「全部清空重来」：</b>'
    + '那条会把所有东西清掉。这种不可逆的事，值得你专门去终端敲一次 '
    + '<code>./loop.sh reset</code>，而不是手滑点到。</div>';
}

// ---------- 小组件 ----------
function kpi(cls, val, label, bar){
  return '<div class="k '+cls+'"><b>'+val+'</b><span>'+label+'</span>'+(bar||"")+'</div>';
}
function pctv(a,b){ const p = b? Math.round(a*100/b):0;
  return '<div class="prog"><i style="width:'+p+'%"></i></div>'; }
function moneyText(){ return S.budget ? S.spent.toFixed(2)+" / "+S.budget
                                      : S.spent.toFixed(2)+"（没设上限）"; }
function budHot(){ return S.budget && S.spent >= S.budget*0.8; }
function budBar(){ if(!S.budget) return "";
  const p = Math.min(Math.round(S.spent*100/parseFloat(S.budget)),100);
  return '<div class="prog '+(budHot()?"hot":"")+'"><i style="width:'+p+'%"></i></div>'; }

// ---------- 画 ----------
//
// 整块 HTML 换掉是最省事的画法，但有个代价：
// 你正在群聊里打字，5 秒一次的自动刷新会把打了一半的字连光标一起抹掉。
// 所以画之前把焦点那个框和滚动位置存下来，画完放回去。
function draw(){
  if(!S) return;
  const a = document.activeElement;
  const keep = (a && a.id && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"))
    ? {id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd} : null;
  const scroll = $("#view").scrollTop;

  $("#idea").textContent = S.idea || "还没说想做什么";
  const pb = $("#pBud");
  pb.textContent = "$" + moneyText();
  pb.className = "pill" + (budHot() ? " hot" : "");
  drawSide();
  const v = $("#view");
  v.innerHTML = VIEW === "flow"   ? vFlow()
              : VIEW === "team"   ? vTeam()
              : VIEW === "chat"   ? vChat()
              : VIEW === "work"   ? vWork()
              : VIEW === "expert" ? vExpert()
              : VIEW === "api"    ? vApi()
              : VIEW === "money"  ? vMoney()
              : VIEW === "think"  ? vThink()
              : VIEW.startsWith("step:") ? vStep(VIEW.slice(5))
              : vFlow();
  wire();
}

function wire(){
  const v = $("#view");
  v.querySelectorAll("[data-run]").forEach(b =>
    b.onclick = () => run(b.dataset.run, []));
  v.querySelectorAll("[data-hire]").forEach(b =>
    b.onclick = () => run("hire", [b.dataset.hire]));
  v.querySelectorAll("[data-arch]").forEach(b =>
    b.onclick = () => { if(confirm("把「"+b.dataset.arch+"」封存起来？（不删，随时能起复）"))
                          run("封存",[b.dataset.arch]); });
  v.querySelectorAll("[data-unarch]").forEach(b =>
    b.onclick = () => run("起复", [b.dataset.unarch]));
  v.querySelectorAll("[data-ask]").forEach(b =>
    b.onclick = () => { const q = prompt("问「"+b.dataset.ask+"」什么？");
                        if(q && q.trim()) run("ask", [b.dataset.ask, q.trim()]); });
  v.querySelectorAll("[data-assign]").forEach(b =>
    b.onclick = () => { const t = prompt("派给「"+b.dataset.assign+"」什么活？说清楚要什么产出。");
                        if(t && t.trim()) run("派活", [b.dataset.assign, t.trim()]); });
  v.querySelectorAll("[data-test]").forEach(b =>
    b.onclick = () => run("接口", ["测", b.dataset.test]));

  v.querySelectorAll("[data-sw]").forEach(sel =>
    sel.onchange = () => {
      const code = sel.value; if(!code) return;
      const name = sel.dataset.sw;
      const key = ($("#fKey")||{}).value || "";
      const args = ["接口", name, code];
      if(code !== "官方" && key.trim()) args.push(key.trim());
      run(args[0], args.slice(1));
      sel.value = "";
    });
  v.querySelectorAll("[data-swlayer]").forEach(b =>
    b.onclick = () => {
      const code = b.dataset.swlayer;
      const who = code === "官方" ? "全部" : "执行层";
      if(!confirm("把「"+who+"」全部换成 "+code+"？")) return;
      const key = ($("#fKey")||{}).value || "";
      const args = [who, code];
      if(code !== "官方" && key.trim()) args.push(key.trim());
      run("接口", args);
    });

  const on = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  on("#bStart", () => { const t = ($("#fIdea").value||"").trim();
    if(!t) return toast("先写一句你想做什么", true); run("start",[t]); });
  on("#bSay", () => { const t = ($("#fSay").value||"").trim();
    if(!t) return toast("先写点什么", true); run("say",[t]); $("#fSay").value=""; });
  on("#bBud", () => { const t = ($("#fBud").value||"").trim();
    if(!t) return toast("填个数", true); run("budget",[t]); });
  on("#bCouncil", () => { const t = prompt("会诊什么议题？");
    if(t && t.trim()) run("会诊",[t.trim()]); });
  on("#bIndustry", () => { const t = prompt("让行业专家去查什么议题？");
    if(t && t.trim()) run("行业报告",[t.trim()]); });
  on("#bPanel", () => { const t = prompt("让专家们讨论什么议题？");
    if(t && t.trim()) run("专家群",[t.trim()]); });
  on("#bClose", () => { if(confirm("结项？会封存现在的东西并写一份复盘。")) run("close",[]); });
}

async function refresh(){
  try{
    const d = await api("/api/state");
    S = d; draw();
  }catch(e){
    $("#view").innerHTML = '<div class="note"><b>连不上面板服务。</b>'
      + '可能是你把终端里那个窗口关了。回终端再跑一次 <code>./loop.sh 面板</code>。</div>';
  }
}

refresh();
setInterval(() => { if(!busy()) refresh(); }, 5000);
</script>
</body></html>
